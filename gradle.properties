# --- Gradle 守护进程使用的 JDK ---
# 必须是 JDK <= 24。Android Studio 自带的 JBR 是 JDK 25，实测执行构建会失败：
#   BUG! exception in phase 'semantic analysis' in source unit '_BuildScript_'
#   Unsupported class file major version 69        (69 = Java 25)
# 用正斜杠，避开 .properties 的反斜杠转义问题。

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# 先关：AGP 8.13 + KSP 偶尔需要重跑任务，配置缓存等主流程稳定后再开。
# 另外注意：配置缓存开启时 org.gradle.java.home 的读取行为会变化。
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
